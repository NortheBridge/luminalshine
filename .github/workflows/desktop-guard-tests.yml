---
name: Desktop guard regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop_guard:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Initialize GoogleTest
        run: git submodule update --init --depth=1 third-party/googletest
      - name: Configure native USER32 regression tests
        run: cmake -S tests/desktop_guard -B build/desktop-guard -A x64
      - name: Build
        run: cmake --build build/desktop-guard --config Release
      - name: Test
        run: ctest --test-dir build/desktop-guard -C Release --output-on-failure
