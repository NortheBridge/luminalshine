---
# Windows C++ coverage workflow. Builds a coverage-instrumented test binary on
# MSYS2/clang, runs it, processes .gcda files with llvm-cov via gcovr, and
# uploads the resulting Cobertura XML to Codecov under the `windows` flag.
#
# Runs on every PR targeting main and on push to main. This is separate from
# ci-windows.yml (which builds packaging artifacts) so the coverage build can
# stay focused — Debug build type, no WiX/NSIS/bootstrapper, no MSI/exe/ZIP
# packaging.

name: Coverage (Windows)
permissions: {}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: coverage-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage_windows:
    name: Windows-AMD64 Coverage
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    permissions:
      contents: read
    env:
      MATRIX_MSYSTEM: ucrt64
      TOOLCHAIN: ucrt-x86_64
    steps:
      - name: Checkout
        # Main repo only. Submodule init is deferred to the next step so we
        # can wrap it in retry/backoff — see "Initialize submodules" below
        # in this file and the matching block in ci-windows.yml for the
        # rationale.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: false
          # Codecov resolves PR context from commit history; depth 0 keeps it
          # reliable for PRs from forks and re-runs.
          fetch-depth: 0

      - name: Initialize submodules
        # Mirror of the matching step in ci-windows.yml — keep the two in
        # sync. Replaces actions/checkout's built-in `submodules: recursive`
        # with a retry loop, because git submodule clones over
        # https://github.com/ are sensitive to transient GHA-side
        # authentication flakes that the bundled checkout action has no
        # retry semantics for. A single 401 on any submodule's clone
        # exit-codes 128 and kills the whole checkout, even though other
        # submodules in the same call succeeded.
        #
        # The actual `git submodule update --init --force --depth=1
        # --recursive` invocation is identical to what `actions/checkout
        # submodules: recursive` would run internally — including the
        # recursive descent that pulls in nested submodules (notably
        # `third-party/moonlight-common-c/enet`, which the Moonlight
        # protocol's networking depends on; without it CMake fails at
        # `add_subdirectory(.../moonlight-common-c/enet)` in
        # cmake/dependencies/common.cmake:10). The historically-broken
        # nested `doxyconfig/doxygen-awesome-css` is no longer walked
        # because the top-level `doxyconfig` entry is commented out in
        # .gitmodules.
        #
        # `actions/checkout` already wired up the AUTHORIZATION header
        # via `git config --global include.path …` in the previous
        # step, so this manual `git submodule update` inherits the same
        # token-backed credentials — no extra plumbing needed.
        #
        # `git submodule deinit --all --force` between attempts strips
        # any partial state from the failed clone so each retry starts
        # from a clean slate. Without it, a half-cloned submodule
        # directory can survive into the next attempt and trigger
        # "destination path already exists" failures that have nothing
        # to do with the original flake.
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            git submodule update --init --force --depth=1 --recursive
            rc=$?
            if [ "${rc}" -eq 0 ]; then
              echo "Submodules initialised on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Submodule init failed on attempt ${attempt} (exit ${rc}); cleaning partial state and retrying."
            git submodule deinit --all --force >/dev/null 2>&1 || true
            sleep_secs=$((attempt * 10))
            echo "Sleeping ${sleep_secs}s before next attempt..."
            sleep "${sleep_secs}"
          done
          echo "::error::Submodule init failed after 5 attempts."
          exit 1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c  # v2.31.1
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget
          path-type: inherit

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0
        with:
          node-version: '22'

      - name: Install MSYS2 packages
        run: |
          dependencies=(
            "git"
            "mingw-w64-${TOOLCHAIN}-boost"
            "mingw-w64-${TOOLCHAIN}-clang"
            "mingw-w64-${TOOLCHAIN}-cmake"
            "mingw-w64-${TOOLCHAIN}-cppwinrt"
            "mingw-w64-${TOOLCHAIN}-curl-winssl"
            "mingw-w64-${TOOLCHAIN}-lld"
            "mingw-w64-${TOOLCHAIN}-miniupnpc"
            "mingw-w64-${TOOLCHAIN}-nlohmann-json"
            "mingw-w64-${TOOLCHAIN}-ninja"
            "mingw-w64-${TOOLCHAIN}-onevpl"
            "mingw-w64-${TOOLCHAIN}-openssl"
            "mingw-w64-${TOOLCHAIN}-opus"
            "mingw-w64-${TOOLCHAIN}-toolchain"
            "mingw-w64-${TOOLCHAIN}-MinHook"
            "mingw-w64-${TOOLCHAIN}-python-gcovr"
            "mingw-w64-${TOOLCHAIN}-compiler-rt"
          )
          # python-gcovr pulls in python, python-lxml, and the rest of gcovr's
          # runtime as MSYS2-prebuilt packages — sidesteps the pip-install
          # lxml-source-compile failure on MSYS2's PEP 668 externally-managed
          # environment (lxml has no pre-built wheel for Python 3.14 on
          # mingw_x86_64_ucrt_gnu so pip would fall back to source build,
          # which then errors out on missing libxml2 headers).
          pacman -Syu --noconfirm "${dependencies[@]}"

      - name: Fetch LuminalVGD driver bundle
        # Same fetch as ci-windows.yml so the CMake configure step doesn't fail
        # on missing driver assets. We only need the files staged; we don't
        # sign/install them in the coverage workflow.
        shell: pwsh
        env:
          LUMINALVGD_VERSION: 'v0.1.0-alpha.9'
          LUMINALVGD_SHA256: '582ad01d8a60ac6f1e017e381d1d1ec8ed00478ec62fc46b80317f47f9dedc16'
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $PWD 'src_assets/windows/drivers/luminalvgd/driver-package'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          $zipUrl = "https://github.com/NortheBridge/LuminalVGD/releases/download/$($env:LUMINALVGD_VERSION)/LuminalVGD-$($env:LUMINALVGD_VERSION)-x64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP 'luminalvgd.zip'
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LUMINALVGD_SHA256) {
            throw "LuminalVGD archive SHA-256 mismatch: expected $($env:LUMINALVGD_SHA256), got $actualHash"
          }
          $tmp = Join-Path $env:RUNNER_TEMP 'luminalvgd'
          Expand-Archive -Path $zipPath -DestinationPath $tmp -Force

          foreach ($file in 'luminalvgd.inf', 'luminal_vgd_driver.dll', 'luminalvgd.cat') {
            $src = Join-Path $tmp "driver-package/$file"
            if (-not (Test-Path $src)) { throw "missing $file in LuminalVGD release zip" }
            Copy-Item $src (Join-Path $packageDir $file) -Force
          }

      - name: Add Rust gnullvm target
        shell: pwsh
        # The vendored luminal-vgd-ffi staticlib builds for
        # x86_64-pc-windows-gnullvm (UCRT-compatible, links into the MSYS2
        # clang build). The runner's preinstalled rustup lacks that
        # target's std, which fails cargo with E0463 "can't find crate for
        # `core`".
        run: rustup target add x86_64-pc-windows-gnullvm

      - name: Configure CMake (coverage)
        env:
          CC: clang
          CXX: clang++
          CFLAGS: "-fms-extensions"
          CXXFLAGS: "-fms-extensions"
          LDFLAGS: "-fuse-ld=lld"
        run: |
          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_WERROR=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_TESTS_WITH_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="NortheBridge Foundation" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://northebridge.com/" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/NortheBridge/luminalshine"

      - name: Build tests
        run: ninja -C build test_sunshine

      - name: Run tests
        id: test
        # Mirrors the ci-windows.yml policy: hosted runner is environment-
        # sensitive (no display adapter, no Playnite, locale gaps) so some test
        # cases reliably fail even when the binaries are healthy. Don't gate the
        # workflow on test failures — coverage upload should still run so PRs
        # see the data either way.
        #
        # The suite runs in SHARDS rather than as one process because gcov only
        # writes its .gcda counters from an atexit handler: a process killed by
        # a signal contributes NOTHING, no matter how many tests passed first.
        # That is the bug this step shipped with — one segfault
        # (SimpleWebLifetime) discarded the entire run, and gcovr
        # then reconstructed a structurally complete but 0%-covered report from
        # the .gcno compile-time notes alone. Nothing in that report says the
        # runtime data is missing, so it uploaded clean and quietly failed
        # codecov/patch on every C++ PR.
        #
        # Sharding bounds the blast radius of a future crash to one shard
        # instead of the whole report; the "Verify coverage data" step below
        # turns a total loss into a hard failure rather than a silent 0%.
        # Shards run sequentially on purpose: libgcov merges each exiting
        # process's counters into the existing .gcda files, so concurrent
        # shards would race on the same files.
        continue-on-error: true
        working-directory: build/tests
        env:
          # No --gtest_filter here: the whole suite runs under coverage.
          #
          # SimpleWebLifetime used to be excluded because it segfaulted within
          # ~25ms in this build while passing in the optimized ci-windows /
          # nightly builds. That was never a timing or instrumentation
          # artifact: the test's SSE leg drove the Simple-Web-Server *client*
          # into a use-after-free that only -O0 makes fatal (-O1 and above
          # happen to survive it), and gcov was an innocent bystander — it
          # writes .gcda from an atexit handler, so the signal merely made the
          # loss visible. Fixed twice over: at the source in the fork
          # (NortheBridge/Simple-Web-Server#3, picked up by the submodule bump)
          # and in tests/unit/test_simpleweb_lifetime.cpp, which now issues
          # that request over a raw socket. The test gates this build again.
          COVERAGE_SHARDS: '6'
        run: |
          set +e
          mkdir -p test_results
          crashed=0
          for i in $(seq 0 $((COVERAGE_SHARDS - 1))); do
            GTEST_TOTAL_SHARDS="${COVERAGE_SHARDS}" GTEST_SHARD_INDEX="${i}" \
              ./test_sunshine.exe \
                --gtest_color=yes \
                --gtest_output="xml:test_results/shard_${i}.xml"
            rc=$?
            # Exit >=128 is a fatal signal (139 = SIGSEGV) and means this
            # shard's counters were never flushed. Exit 1 is ordinary test
            # failures, which still write .gcda normally.
            if [ "${rc}" -ge 128 ]; then
              echo "::warning::Coverage shard ${i} of ${COVERAGE_SHARDS} crashed (exit ${rc}); its counters were lost."
              crashed=$((crashed + 1))
            fi
          done
          if [ "${crashed}" -gt 0 ]; then
            echo "::warning::${crashed} of ${COVERAGE_SHARDS} coverage shards crashed; reported coverage understates reality."
          fi
          exit 0

      - name: Verify coverage data was produced
        # The guard that keeps this gate honest. gcovr will happily emit a
        # complete-looking 0% report from .gcno notes alone when no .gcda
        # runtime data exists, and neither the XML nor the Codecov UI
        # distinguishes that from "genuinely untested". Fail loudly here
        # instead: uploading a run with no runtime data is worse than not
        # uploading at all, because codecov/patch then reports "0.00% of diff
        # hit" on every C++ PR until reviewers learn to ignore a red check.
        working-directory: build
        run: |
          gcno=$(find . -name '*.gcno' | wc -l)
          gcda=$(find . -name '*.gcda' | wc -l)
          echo "Coverage notes (.gcno, compile time): ${gcno}"
          echo "Coverage data  (.gcda, run time):     ${gcda}"
          if [ "${gcda}" -eq 0 ]; then
            echo "::error::No .gcda files were produced — the instrumented test binary never reached a clean exit, so every coverage counter was lost. See the 'Run tests' step for a crash. Refusing to upload a report that would show 0% for the entire tree."
            exit 1
          fi

      - name: Generate coverage XML
        # No always() here: if the guard above failed there is no runtime data,
        # and generating/uploading the report regardless is the original bug.
        working-directory: build
        run: |
          python -m gcovr \
            --gcov-executable "llvm-cov gcov" \
            . \
            -r ../src \
            --exclude-noncode-lines \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --exclude '.*/third-party/.*' \
            --exclude '.*/tests/.*' \
            --verbose \
            --xml-pretty \
            -o coverage.xml

      - name: Upload coverage artifact
        if: always() && steps.test.outcome != 'cancelled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-windows
          path: |
            build/coverage.xml
            build/tests/test_results/
          if-no-files-found: warn

      - name: Upload to Codecov
        # Deliberately not always(): an upload with no runtime data is exactly
        # the failure mode this workflow is being fixed for.
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.xml
          flags: windows
          name: windows-amd64
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov Test Analytics
        # `--gtest_output=xml:...` above already emits the JUnit-compatible
        # XML (one file per shard); this step just ships them. Run even when
        # the test step exited non-zero (continue-on-error keeps the
        # workflow alive) so the Test Analytics dashboard records
        # failing / flaky tests — those are the ones worth tracking,
        # and suppressing the upload on red runs would lose the signal.
        #
        # codecov-action@v5+ subsumed the standalone test-results-action
        # via `report_type: test_results` — codecov/test-results-action
        # is being deprecated, and the v1 release also ships on
        # Node.js 20 which the GitHub Actions runner is sunsetting on
        # 2026-09-16. Reusing the v6.0.0 SHA already pinned for the
        # coverage upload above keeps both uploads on the same action
        # version with no second SHA to keep in sync.
        if: always() && steps.test.outcome != 'cancelled'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: build/tests/test_results/shard_0.xml,build/tests/test_results/shard_1.xml,build/tests/test_results/shard_2.xml,build/tests/test_results/shard_3.xml,build/tests/test_results/shard_4.xml,build/tests/test_results/shard_5.xml
          flags: windows
          name: windows-amd64-results
          # Non-blocking: a test-results upload failure is observability
          # noise, not a correctness signal — the coverage upload above
          # is what carries the gating data.
          fail_ci_if_error: false
          verbose: true
